# Настройки Python-оркестратора `scripts/auto_dev.py`
# Читаются простым регэкспом: ключ: значение, одна пара на строку.

tasks_per_run: 5

session:
  # Таймаут одной сессии, минуты (переопределяется `--timeout` в секундах).
  timeout_minutes: 20
  # Повторы только для транзиентных сбоев (сеть/провайдер), задача в roadmap не тронута.
  max_attempts_per_task: 1
  # Вариант модели: low / medium / high. Промпт и правила дают больше, чем high.
  model: a6api/deepseek-v4.1-flash-1017#low

context:
  # Список для человека: AGENTS.md OpenCode читает сам, остальное агент читает по требованию.
  # В запрос файлы НЕ прикладываются (иначе тот же текст оплачивается дважды).
  files:
    - docs/project-context.md
    - docs/progress.md
    - docs/roadmap.md
    - docs/manual-queue.md

execution:
  allow_build: false
  allow_tests: false
  allow_complex_checks: false
  allow_git_commit: false
  allow_git_push: false

reports:
  update_progress: true
  update_manual_queue: true
  save_session_logs: true

stop_conditions:
  stop_on_context_error: true
  stop_when_no_tasks: true
  stop_on_repeated_failure: true
