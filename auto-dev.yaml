# Настройки Python-оркестратора
tasks_per_run: 5

session:
  timeout_minutes: 20
  max_attempts_per_task: 1

context:
  files:
    - AGENTS.md
    - docs/project-context.md
    - docs/progress.md
    - docs/roadmap.md
    - docs/manual-queue.md

execution:
  allow_build: false
  allow_tests: false
  allow_complex_checks: false
  allow_git_commit: false
  allow_git_push: false

reports:
  update_progress: true
  update_manual_queue: true
  save_session_logs: true

stop_conditions:
  stop_on_context_error: true
  stop_when_no_tasks: true
  stop_on_repeated_failure: true
